# CNexus Product only (monorepo root wrapper)
# Usage: docker compose -f docker-compose.product.yml up --build

services:
  cnexus-product:
    build:
      context: ./brain-memory-ui/frontend
      dockerfile: Dockerfile
    ports:
      - "${CNEXUS_PRODUCT_PORT:-3000}:3000"
    environment:
      CNEXUS_API_BASE: ${CNEXUS_API_BASE:-http://localhost:8000}
      CNEXUS_WS_BASE: ${CNEXUS_WS_BASE:-ws://localhost:8000}
      CNEXUS_EDITION: ${CNEXUS_EDITION:-personal}
    restart: unless-stopped

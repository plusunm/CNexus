[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-memory"
version = "5.0.0"
description = "Persistent Cognitive Runtime for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "lancedb>=0.6",
    "kuzu>=0.4",
    "numpy>=1.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_memory*", "core*", "memory*", "storage*", "runtime*", "api*"]

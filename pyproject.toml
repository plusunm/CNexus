[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnexus-runtime-core"
version = "0.1.0-alpha"
description = "CNexus cognitive runtime core (Tier 1 — private distribution)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "lancedb>=0.6",
    "kuzu>=0.4",
    "numpy>=1.24",
    "networkx>=3.0",
    "python-dateutil>=2.9.0",
    "httpx>=0.27",
]

[project.scripts]
brain-memory = "brain_memory.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_memory*", "core*", "memory*", "storage*", "runtime*"]
exclude = ["api*"]

[tool.setuptools.package-data]
core = ["**/*.json"]
"*" = ["**/*.json"]

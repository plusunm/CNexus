[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-memory-g1"
version = "1.0.0-g1"
description = "Persistent Cognitive Runtime for Long-Lived AI Agents (G1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "lancedb>=0.6",
    "kuzu>=0.4",
    "numpy>=1.24",
    "python-dateutil>=2.9.0",
    "httpx>=0.27",
]

[project.scripts]
brain-memory = "brain_memory.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_memory*", "core*", "memory*", "storage*", "runtime*", "api*"]

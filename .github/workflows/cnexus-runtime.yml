name: CNexus Runtime CI

on:
  push:
    branches: [main]
    paths:
      - "brain_memory/**"
      - "core/**"
      - "api/**"
      - "brain-memory-ui/api/**"
      - "brain-memory-ui/Dockerfile.runtime"
      - "brain-memory-ui/Dockerfile.runtime.dev"
      - "DEPLOYMENT_SECURITY.md"
      - "cnexus-runtime/**"
      - "tests/test_cnexus_runtime_contract.py"
      - "docker-compose.runtime.yml"
      - "docker-compose.full.yml"
      - "requirements.txt"
      - ".github/workflows/cnexus-runtime.yml"
  pull_request:
    paths:
      - "brain_memory/**"
      - "core/**"
      - "api/**"
      - "brain-memory-ui/api/**"
      - "brain-memory-ui/Dockerfile.runtime"
      - "brain-memory-ui/Dockerfile.runtime.dev"
      - "DEPLOYMENT_SECURITY.md"
      - "cnexus-runtime/**"
      - "tests/test_cnexus_runtime_contract.py"
      - "docker-compose.runtime.yml"
      - "docker-compose.full.yml"
      - "requirements.txt"
      - ".github/workflows/cnexus-runtime.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: cnexus-runtime

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r brain-memory-ui/api/requirements.txt pytest httpx

      - name: Kernel boundary (Product)
        run: |
          cd brain-memory-ui/frontend
          npm ci
          npm run test:kernel-boundary

      - name: Runtime API contract (REST + WS)
        run: python -m pytest tests/test_cnexus_runtime_contract.py -q --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Runtime Docker image
        run: docker build -f brain-memory-ui/Dockerfile.runtime -t ${{ env.IMAGE_NAME }}:ci .

      - name: Smoke run Runtime API
        run: |
          docker run -d --name cnexus-runtime-ci -p 8000:8000 \
            -e BM_MEMORY_DIR=/tmp/memory \
            ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8000/v1/mind/overview | grep -q schema_version
          docker stop cnexus-runtime-ci

  publish-docker:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          docker build -f brain-memory-ui/Dockerfile.runtime -t ${IMAGE}:latest -t ${IMAGE}:${{ github.sha }} .
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

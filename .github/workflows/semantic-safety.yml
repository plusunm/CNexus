name: Semantic Safety v2

on:
  pull_request:
  push:
    branches: [main]

jobs:
  semantic-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Semantic Safety Checker (v2 + v3)
        run: python scripts/semantic_safety_check.py --strict --v3 --json-out docs/semantic_safety/v3_baseline.json

      - name: Semantic Safety v5 Isolation
        run: python scripts/semantic_safety_v5_isolation.py --json-out docs/semantic_safety/v5_isolation_report.json

      - name: Semantic Safety v6 Dissolution
        run: python scripts/semantic_safety_v6_dissolution.py --json-out docs/semantic_safety/v6_dissolution_report.json

      - name: L8 Unified Kernel
        run: python scripts/l8_field_report.py --json-out docs/l8_unified_report.json

      - name: L8/G8 Influence Causality Test
        run: python scripts/run_l8g8_influence_test.py --mode full --json-out docs/semantic_safety/l8g8_influence_report.json

      - name: Observation Gateway contract smoke
        run: python scripts/observation_gateway_check.py --base-dir /tmp/cnexus-ci-obs --json-out docs/observation/gateway_smoke.json

      - name: Observation P2 streaming L2 smoke
        run: |
          python scripts/observation_gateway_check.py --base-dir /tmp/cnexus-ci-p2
          python scripts/observation_stream_l2.py --base-dir /tmp/cnexus-ci-p2 --text --poll --json-out docs/observation/streaming_l2_smoke.json

      - name: Unit tests
        run: python -m unittest discover -s tests -v

# CNexus Runtime only
# Usage: docker compose -f docker-compose.runtime.yml up --build

services:
  cnexus-runtime:
    build:
      context: .
      dockerfile: brain-memory-ui/Dockerfile.runtime
    ports:
      - "${CNEXUS_RUNTIME_PORT:-8000}:8000"
    environment:
      BRAIN_MEMORY_ROOT: /app
      BM_MEMORY_DIR: /data/memory
      CNEXUS_DEPLOY_LEVEL: ${CNEXUS_DEPLOY_LEVEL:-internal}
    volumes:
      - cnexus_memory:/data/memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  cnexus_memory:

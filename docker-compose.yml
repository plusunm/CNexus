services:
  cnexus:
    build: .
    ports:
      - "8000:8000"
    environment:
      BRAIN_MEMORY_ROOT: /app
      BM_MEMORY_DIR: /data/memory
      CNEXUS_ENV: production
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - cnexus_memory:/data/memory
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/health/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  cnexus_memory:
  ollama_models:

# CNexus Product + Runtime (monorepo root wrapper)
# Product: http://localhost:3000  |  Runtime: http://localhost:8000

services:
  cnexus-runtime:
    build:
      context: .
      dockerfile: brain-memory-ui/Dockerfile.runtime
    ports:
      - "${CNEXUS_RUNTIME_PORT:-8000}:8000"
    environment:
      BRAIN_MEMORY_ROOT: /app
      BM_MEMORY_DIR: /data/memory
      CNEXUS_DEPLOY_LEVEL: ${CNEXUS_DEPLOY_LEVEL:-internal}
    volumes:
      - cnexus_memory:/data/memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  cnexus-product:
    build:
      context: ./brain-memory-ui/frontend
      dockerfile: Dockerfile
    ports:
      - "${CNEXUS_PRODUCT_PORT:-3000}:3000"
    environment:
      CNEXUS_API_BASE: ${CNEXUS_API_BASE:-http://localhost:8000}
      CNEXUS_WS_BASE: ${CNEXUS_WS_BASE:-ws://localhost:8000}
    depends_on:
      cnexus-runtime:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cnexus_memory:

# CNexus Product only — Demo works offline; Runtime URL configurable at container start.
# Usage: docker compose -f docker-compose.product.yml up --build
# Open: http://localhost:3000

services:
  cnexus-product:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${CNEXUS_PRODUCT_PORT:-3000}:3000"
    environment:
      # Browser must reach API — use host-accessible URL, not docker internal DNS
      CNEXUS_API_BASE: ${CNEXUS_API_BASE:-http://localhost:8000}
      CNEXUS_WS_BASE: ${CNEXUS_WS_BASE:-ws://localhost:8000}
    restart: unless-stopped
